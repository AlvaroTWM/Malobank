<script type="module">
/* Prototipo: un personaje (El CEO) y un escenario (Torre Malo Bank de noche) en PixiJS v8 (WebGL).
   Mundo lógico 960×540; se dibuja a una textura intermedia y se escala a la pantalla.
   En "Modo pixel" la textura baja a 480×270 sin suavizado: el mismo arte con estética pixel. */
const VW=960,VH=540,GROUND=468,WORLD=1700,OUT=0x140c1c;
try{await Promise.race([document.fonts.load('16px "Press Start 2P"'),new Promise(r=>setTimeout(r,1500))]);}catch(e){}
const app=new PIXI.Application();
await app.init({resizeTo:window,background:'#0b0710',antialias:true,resolution:Math.min(window.devicePixelRatio||1,2),autoDensity:true});
document.body.appendChild(app.canvas);

/* ---------- utilidades ---------- */
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);return PIXI.Texture.from(c);}
const GLOW=canvasTex(128,128,(x,w)=>{const g=x.createRadialGradient(w/2,w/2,0,w/2,w/2,w/2);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.3,'rgba(255,255,255,.5)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,w,w);});
function glow(tint,w,h,a){const s=new PIXI.Sprite(GLOW);s.anchor.set(.5);s.tint=tint;s.width=w;s.height=h;s.alpha=a;s.blendMode='add';return s;}
function txt(t,size,fill,stroke,sw){return new PIXI.Text({text:t,style:{fontFamily:'"Press Start 2P", monospace',fontSize:size,fill,stroke:stroke?{color:stroke,width:sw||4,join:'round'}:undefined,align:'center'}});}

/* ---------- escena y textura intermedia ---------- */
const world=new PIXI.Container();           // todo lo que se dibuja (coordenadas 960×540)
const view=new PIXI.Sprite();app.stage.addChild(view);
let rt=null,pixel=false;
function layout(){
 const sw=app.screen.width,sh=app.screen.height,fit=Math.min(sw/VW,sh/VH);
 const rs=pixel?.5:clamp(fit*app.renderer.resolution,1,2);
 if(!rt||rt.__rs!==rs||rt.__px!==pixel){
  if(rt)rt.destroy(true);
  rt=PIXI.RenderTexture.create({width:Math.round(VW*rs),height:Math.round(VH*rs),antialias:!pixel});
  rt.__rs=rs;rt.__px=pixel;try{rt.source.scaleMode=pixel?'nearest':'linear';}catch(e){}
  view.texture=rt;
 }
 world.scale.set(rs);
 view.width=VW*fit;view.height=VH*fit;view.x=Math.round((sw-VW*fit)/2);view.y=Math.round((sh-VH*fit)/2);
}
app.renderer.on('resize',layout);

const layers=[];
function layer(f){const c=new PIXI.Container();c.__f=f;world.addChild(c);layers.push(c);return c;}
const layW=f=>Math.ceil((WORLD-VW)*f+VW);

/* ---------- cielo ---------- */
const Lsky=layer(0);
Lsky.addChild(new PIXI.Sprite(canvasTex(4,VH,(x,w,h)=>{const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#0e0826');g.addColorStop(.35,'#2a1650');g.addColorStop(.62,'#7a2f68');g.addColorStop(.78,'#d4626a');g.addColorStop(1,'#f29a62');x.fillStyle=g;x.fillRect(0,0,w,h);})));
Lsky.children[0].width=VW;
const stars=[];{const r=rng(4);for(let i=0;i<70;i++){const s=new PIXI.Graphics().circle(0,0,r()<.15?1.6:.9).fill(0xffffff);s.x=r()*VW;s.y=r()*230;s.__p=r()*6;stars.push(s);Lsky.addChild(s);}}
const Lmoon=layer(.03);
Lmoon.addChild(glow(0xffe2c0,260,260,.35));Lmoon.children[0].position.set(780,96);
Lmoon.addChild(new PIXI.Graphics().circle(780,96,26).fill(0xfff1d6).circle(772,90,6).fill({color:0xe8d6b8,alpha:.8}).circle(788,104,4).fill({color:0xe8d6b8,alpha:.8}));

  x.fillStyle=opt.col[(r()*opt.col.length)|0];x.fillRect(px,top,bw,bh+opt.base);
  if(r()<.4){x.fillRect(px+bw*.4,top-14-r()*20,3,40);}
  if(opt.edge){x.fillStyle=opt.edge;x.fillRect(px+bw-3,top,3,bh+opt.base);}
  for(let yy=top+8;yy<GROUND-opt.base-8;yy+=opt.wy)for(let xx=px+6;xx<px+bw-8;xx+=opt.wx){const v=r();if(v<opt.lit){x.fillStyle=v<opt.lit*.25?'#8fd3ff':(v<opt.lit*.6?'#ffd27a':'#ffb35a');x.globalAlpha=.55+r()*.45;x.fillRect(xx,yy,opt.ww,opt.wh);x.globalAlpha=1;}}
  if(opt.signs&&r()<.45){const s=opt.signs[(r()*opt.signs.length)|0];x.font='bold 13px "Pixelify Sans", monospace';const tw=x.measureText(s).width+14,sy=top+20+r()*40;
   x.fillStyle='#0c0812';x.fillRect(px+bw/2-tw/2,sy,tw,22);const nc=['#ff3d6e','#4aa8ff','#c6f27a','#ffd23f'][(r()*4)|0];
   x.shadowColor=nc;x.shadowBlur=12;x.fillStyle=nc;x.textAlign='center';x.fillText(s,px+bw/2,sy+16);x.shadowBlur=0;}
  px+=bw+opt.gap*r();}
 if(opt.haze){const g=x.createLinearGradient(0,GROUND-240,0,GROUND);g.addColorStop(0,'rgba(212,98,106,0)');g.addColorStop(1,opt.haze);x.fillStyle=g;x.fillRect(0,GROUND-240,w,240);}});}
const Lfar=layer(.1);
Lfar.addChild(new PIXI.Sprite(cityTex(layW(.1),7,{minW:40,maxW:90,minH:90,maxH:220,base:28,col:['#3a2150','#43255a','#352048'],lit:.12,wx:9,wy:11,ww:3,wh:4,gap:6,haze:'rgba(212,98,106,.55)'})));

Lmid.addChild(new PIXI.Sprite(cityTex(layW(.25),19,{minW:80,maxW:150,minH:120,maxH:260,base:28,col:['#22163a','#2a1a44','#1d1433'],edge:'#3b2a5c',lit:.22,wx:14,wy:16,ww:6,wh:8,gap:18,signs:['CAMBIOS','PRÉSTAMOS YA','EMPEÑOS','24 HS','CUOTAS'],haze:'rgba(122,47,104,.35)'})));

 for(let row=0;row<ROWS+4;row++)for(let col=0;col<2;col++)tower.poly([TX+306+col*18,TT+26+row*13+col*4,TX+318+col*18,TT+33+row*13+col*4,TX+318+col*18,TT+40+row*13+col*4,TX+306+col*18,TT+33+row*13+col*4]).fill(0x1f3c5e);}

// cartel de neón

signBox.rect(TX+70,TT-16,4,10).fill(0x2a2238).rect(TX+226,TT-16,4,10).fill(0x2a2238);Ltower.addChild(signBox);

const heli=new PIXI.Graphics().ellipse(0,0,16,7).fill(0x15101e).rect(10,-2,26,3).fill(0x15101e).rect(-26,-11,52,2).fill(0x2a2238);Lheli.addChild(heli);

for(let x=0;x<layW(.7);x+=34)walk.rect(x,GROUND-30,2,22).fill(0x3a3448);
walk.rect(0,GROUND-30,layW(.7),2).fill(0x6a6478).rect(0,GROUND-10,layW(.7),4).fill(0x8a8498);Lwalk.addChild(walk);
const Lground=layer(1);
const asphalt=new PIXI.Sprite(canvasTex(4,VH-GROUND+10,(x,w,h)=>{const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#2a2434');g.addColorStop(1,'#120d18');x.fillStyle=g;x.fillRect(0,0,w,h);}));
asphalt.width=WORLD;asphalt.y=GROUND-6;Lground.addChild(asphalt);
{const gl=new PIXI.Graphics();for(let x=40;x<WORLD;x+=150)gl.poly([x,GROUND+34,x+70,GROUND+34,x+76,GROUND+40,x+6,GROUND+40]).fill({color:0xf2ead8,alpha:.35});
 const r=rng(55);for(let i=0;i<14;i++){const px=r()*WORLD,pw=60+r()*120;gl.ellipse(px,GROUND+20+r()*44,pw,4+r()*5).fill({color:0x6a5a8a,alpha:.22});}Lground.addChild(gl);}
const Lrefl=layer(.45);   // reflejos del neón en el piso mojado
const nRefl=glow(0xff3d6e,240,60,.3);nRefl.position.set(TX+150,GROUND+30);Lrefl.addChild(nRefl);
const nRefl2=glow(0xff6b8e,60,170,.18);nRefl2.position.set(TX+150,GROUND+60);Lrefl.addChild(nRefl2);

/* ---------- público ---------- */
const Lcrowd=layer(.7),crowd=[];
{const r=rng(91),signs=['NDAIPÓRI SALDO','APP CAÍDA','QUIERO COBRAR','¡DEVOLVÉ!','¿Y MI PLATA, KP?'],cols=[0x2b2346,0x3a2d5c,0x1f1a35,0x3b3150,0x2d2a4a];let k=0;
 for(let x=10;x<layW(.7);x+=26+r()*22){k++;const p=new PIXI.Container(),h=46+r()*16,c=cols[k%cols.length];const g=new PIXI.Graphics();
  g.roundRect(-11,-h,22,h,6).fill(c);g.circle(0,-h-9,10).fill(0x2a2036);g.rect(-11,-h+4,3,h-8).fill({color:0xff6b8e,alpha:.35});g.rect(8,-h+4,3,h-8).fill({color:0x4aa8ff,alpha:.3});g.arc(0,-h-9,10,-2.6,-1.2).stroke({width:2,color:0xff8aa8,alpha:.5});
  p.addChild(g);
  if(k%4===2){const s=signs[(k/4|0)%signs.length],t=txt(s,6,0xb32a35);t.anchor.set(.5);const sw=t.width+10;const sg=new PIXI.Graphics().rect(-1,-h-48,3,40).fill(0x7a5a3a).rect(-sw/2,-h-64,sw,20).fill(0xf2ead8).stroke({width:2,color:0xb9a98a});t.position.set(0,-h-54);p.addChild(sg,t);}
  if(k%3===0){const arm=new PIXI.Graphics().roundRect(-3,-22,6,22,3).fill(c);arm.position.set(10,-h+6);p.addChild(arm);p.__arm=arm;}
  p.position.set(x,GROUND-26);p.__p=r()*6;crowd.push(p);Lcrowd.addChild(p);}}

car.poly([CX+50,GROUND-62,CX+60,GROUND-78,CX+66,GROUND-78,CX+56,GROUND-62]).fill({color:0xffffff,alpha:.3});

const Lfight=layer(1);Lfight.sortableChildren=true;

{const g=new PIXI.Graphics();g.rect(-1.5,0,3,42).fill(0x777788);
 g.roundRect(-38,40,76,150,26).fill(0xb08850).stroke({width:3,color:OUT});g.roundRect(-38,40,22,150,20).fill({color:0x8a6838,alpha:.9});g.roundRect(18,52,8,120,4).fill({color:0xe0c080,alpha:.5});

/* ---------- El CEO: rig de piezas (animación esqueletal tipo "cutout") ---------- */

 P.torso.position.set(hip[0],hip[1]);P.torso.rotation=p.lean;
 const nk=tr(4,-70);P.neck.position.set(nk[0],nk[1]);P.neck.rotation=p.lean*.6;

const F={x:800,face:1,st:'idle',t:0,atk:null,hit:false,walkP:0,cur:{...POSE.guard},hurtT:0};
const B={a:0,w:0,hp:100,flash:0,broke:0};
let T=0,stop=0,shake=0,camX=clamp((F.x+BAGX)/2-VW/2,0,WORLD-VW),demo={next:0,mode:'walk'};
function startAtk(k){if(F.atk||F.st==='win')return;F.atk=k;F.t=0;F.hit=false;}
function bagX(){return BAGX+Math.sin(B.a)*150;}

function step(){
 T++;
 // demo automática si nadie toca nada
 const auto=T-lastInput>150;let L=inp.left,R=inp.right;
 if(auto&&F.st!=='win'){const d=bagX()-F.x;if(d>118){R=1;}else if(d<82){L=1;}else if(T>demo.next&&!F.atk){startAtk(Math.random()<.55?'punch':'kick');demo.next=T+20+Math.random()*30;}}
 else if(!auto){if(inp.punch){startAtk('punch');inp.punch=0;}if(inp.kick){startAtk('kick');inp.kick=0;}}
 if(stop>0){stop--;return;}
 // personaje
 let tgt=POSE.guard;
 if(F.st==='win'){tgt=POSE.win;if(--F.hurtT<=0){F.st='idle';B.hp=100;}}
 else if(F.atk){const a=ATK[F.atk];F.t++;tgt=sampleAtk(a,F.t);if(F.t>=a.len){F.atk=null;}}
 else{const mv=(R?1:0)-(L?1:0);if(mv){F.x=clamp(F.x+mv*3.4,140,BAGX-70);F.walkP+=.17*mv*F.face;F.st='walk';}else F.st='idle';
  if(F.st==='walk'){const s=Math.sin(F.walkP),c=Math.cos(F.walkP);tgt={...POSE.guard,thF:.18+.42*s,shF:-.25-.45*Math.max(0,-c),thB:.0-.42*s,shB:.15+.45*Math.max(0,c),lean:.14,hx:0};}}
 const k=F.atk?1:.22;for(const q of KEYS)F.cur[q]=lerp(F.cur[q],tgt[q],k);
 // golpe
 if(F.atk&&!F.hit){const a=ATK[F.atk];if(F.t>=a.act[0]&&F.t<=a.act[1]){const ends=applyPose(F.cur,0);const e=ends[a.reach];const wx=F.x+e[0]*F.face,wy=GROUND+e[1];
   const bx=bagX(),by=BAGTOP+40+Math.cos(B.a)*0;if(Math.abs(wx-bx)<44&&wy>BAGTOP+40&&wy<BAGTOP+200){F.hit=true;
    stop=a.pow>1?8:6;shake=a.pow>1?12:7;B.w+=.011*a.pow*F.face;B.flash=1;B.hp-=a.pow>1?14:9;thump(a.pow>1?.8:1.2);
    spark(wx,wy,0xffd23f,12,6);spark(wx,wy,0xffffff,6,4);shock(wx,wy);bills(bx,wy,a.pow>1?6:3,F.face);
    pop(a.pow>1?'¡ZAS!':'¡PUM!',wx,wy-50,a.pow>1?26:20,a.pow>1?0xff4d5a:0xffd23f);
    if(B.hp<=0){B.hp=0;bills(bx,BAGTOP+110,50,F.face);spark(bx,BAGTOP+110,0xc6f27a,30,9);pop('¡SE ROMPIÓ EL SACO!',VW/2+camX,200,24,0xc6f27a);F.st='win';F.hurtT=110;F.atk=null;stop=14;shake=16;}}}}
 // saco: péndulo
 B.w+=-Math.sin(B.a)*.006;B.w*=.985;B.a+=B.w;B.flash*=.8;
 if(bagX()-F.x<62)F.x=bagX()-62;
 shake*=.85;
}

 const sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;
 for(const L of layers){L.x=Math.round(-camX*L.__f+(L.__f?sx*L.__f:0));L.y=L.__f?sy*Math.min(1,L.__f):0;}
 // cielo

 const fl=(T%240>200&&T%240<215&&(T>>1)%2)?.25:1;neon.alpha=fl;neonGlow.alpha=.55*fl+.06*Math.sin(T*.2);neonCore.alpha=.35*fl;nRefl.alpha=.3*fl;nRefl2.alpha=.18*fl;

 cone.position.set(hx,20);cone.rotation=Math.sin(T*.013)*.35;cone.height=520;cone.alpha=.14+.03*Math.sin(T*.1);
 // sirena
 const ph=(T>>4)%2;sirenR.alpha=floorR.alpha=ph?.95:.12;sirenB.alpha=floorB.alpha=ph?.12:.95;floorR.alpha*=.35;floorB.alpha*=.35;rboxR.alpha=ph?1:.4;rboxB.alpha=ph?.4:1;
 // público
 for(const p of crowd){const b=Math.abs(Math.sin(T*.07+p.__p))*(B.hp<60?6:3);p.y=GROUND-26-b;if(p.__arm)p.__arm.rotation=Math.sin(T*.12+p.__p)*.6-(B.hp<60?.4:0);}
 // personaje
 const bob=F.st==='idle'&&!F.atk?Math.sin(T*.08)*1.5:(F.st==='walk'?-Math.abs(Math.sin(F.walkP))*3:0);
 applyPose(F.cur,bob);
 ceo.position.set(F.x,GROUND);ceo.scale.x=F.face;shadow.position.set(F.x,GROUND+2);
 P.head.__face.visible=F.st!=='hurt';P.head.__hurt.visible=F.st==='hurt';
